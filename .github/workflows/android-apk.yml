
name: Build V-Music APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip V-Music_Flutter_Starter.zip -d source

      - name: Generate platforms
        working-directory: source
        run: flutter create --platforms=android,ios --org com.vmusic .

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Build APK
        working-directory: source
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Music-APK
          path: source/build/app/outputs/flutter-apk/app-release.apk
          
