name: Build V-Music APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip V-Music_Flutter_Starter.zip -d source

      - name: Build project
        working-directory: source/v_music
        run: |
          flutter create --platforms=android,ios --org com.vmusic .
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: V-Music-APK
          path: source/v_music/build/app/outputs/flutter-apk/app-release.apk
